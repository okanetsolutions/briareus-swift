name: iPhone build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- Briareus.xcodeproj
      - name: Test networking and transcript core
        run: swift test
      - name: Check saved prompt loading and connection changes
        run: |
          swiftc -target "$(uname -m)-apple-macosx14.0" -parse-as-library Mac/Core/*.swift App/Shared/SavedPrompts.swift scripts/check_saved_prompts.swift -o "$RUNNER_TEMP/check-saved-prompts"
          "$RUNNER_TEMP/check-saved-prompts"
      - name: Check project feed cancellation and overlapping reads
        run: |
          swiftc -target "$(uname -m)-apple-macosx14.0" -parse-as-library Mac/Core/*.swift App/ProjectFeed.swift scripts/check_project_feed.swift -o "$RUNNER_TEMP/check-project-feed"
          "$RUNNER_TEMP/check-project-feed"
      - name: Check global pull reads and catalog throttling
        run: |
          swiftc -target "$(uname -m)-apple-macosx14.0" -parse-as-library Mac/Core/*.swift Mac/App/Board/BoardModel+Reading.swift Mac/App/Board/GlobalPullsModel.swift scripts/check_global_pulls.swift -o "$RUNNER_TEMP/check-global-pulls"
          "$RUNNER_TEMP/check-global-pulls"
      - name: Check phone global board progress during slow auxiliary reads
        run: |
          swiftc -target "$(uname -m)-apple-macosx14.0" -parse-as-library Mac/Core/*.swift App/ProjectFeed.swift App/Board/GlobalPullsModel.swift scripts/check_phone_global_pulls.swift -o "$RUNNER_TEMP/check-phone-global-pulls"
          "$RUNNER_TEMP/check-phone-global-pulls"
      - name: Check server dashboard tab loading and cancellation in both apps
        run: |
          for MODEL in App/Stats/StatsModels.swift Mac/App/Stats/StatsModels.swift; do
            swiftc -target "$(uname -m)-apple-macosx14.0" -parse-as-library Mac/Core/*.swift "$MODEL" scripts/check_server_dashboard.swift -o "$RUNNER_TEMP/check-server-dashboard"
            "$RUNNER_TEMP/check-server-dashboard"
          done
      - name: Check personal connections, sharing and monitor credential lifecycle
        run: |
          swiftc -target "$(uname -m)-apple-macosx14.0" -parse-as-library Mac/Core/*.swift App/Settings/PersonalConnectionModel.swift App/Settings/SharingModel.swift App/Stats/SSHMonitoringModel.swift scripts/check_client_updates.swift -o "$RUNNER_TEMP/check-client-updates"
          "$RUNNER_TEMP/check-client-updates"
  structure:
    name: Structure guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check escape hatches against the base
        run: python3 scripts/check_escape_hatches.py "origin/${{ github.base_ref || 'main' }}"
  simulator:
    name: Simulator build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build for iPhone Simulator
        run: xcodebuild -project Briareus.xcodeproj -scheme Briareus -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/Briareus.app Briareus-Simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Briareus-Simulator
          path: Briareus-Simulator.zip
  device:
    name: iPhone build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build for physical iPhone (unsigned)
        run: xcodebuild -project Briareus.xcodeproj -scheme Briareus -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceBuild CODE_SIGNING_ALLOWED=NO build
  mac:
    name: Mac build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the Mac app (unsigned)
        run: xcodebuild -project Briareus.xcodeproj -scheme "Briareus Mac" -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath MacBuild CODE_SIGNING_ALLOWED=NO build
  pairing:
    name: Pairing UI test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Choose an installed iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Boot the selected simulator
        timeout-minutes: 4
        run: |
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test pairing on iPhone Simulator
        # Launching the test runner alone can take over five minutes on a slow hosted runner.
        timeout-minutes: 15
        run: xcodebuild -project Briareus.xcodeproj -scheme Briareus -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iPhone-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
  # Branch protection requires a check named "ios"; it passes only when every job above did.
  ios:
    name: ios
    if: always()
    needs: [core, structure, simulator, device, mac, pairing]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
